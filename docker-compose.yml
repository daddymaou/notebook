services:
  sidecar:
    build:
      context: ./sidecar
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ./sidecar/.env
    volumes:
      - ./sidecar:/app
      - /app/node_modules
    working_dir: /app
    command: ["npm", "start"]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: go-backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SIDECAR_URL=http://sidecar:4000
      - PORT=8080
    depends_on:
      - sidecar
    volumes:
      - ./static:/static:ro
    restart: unless-stopped
