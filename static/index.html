<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fdfbf5">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <title>notebook</title>
  <meta name="description" content="A paper-feeling blog. Write on ruled lines, publish to a link.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="notebook">
  <meta property="og:description" content="A paper-feeling blog. Write on ruled lines, publish to a link.">
  <meta property="og:image" content="/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="notebook">
  <meta name="twitter:description" content="A paper-feeling blog. Write on ruled lines, publish to a link.">
  <meta name="twitter:image" content="/og.png">
</head>
<body>
  <div class="desk">
    <header class="home-header">
      <h1>notebook</h1>
      <a class="about-link" href="/about">about</a>
    </header>

    <div class="actions" style="justify-content:flex-start;margin-bottom:12px;">
      <a href="/new" class="btn-tear" style="text-decoration:none;display:inline-flex;align-items:center;">Write a page</a>
    </div>

    <div class="paper" id="toc-paper">
      <ul class="toc" id="toc">
        <li class="empty">loading the notebook…</li>
      </ul>
    </div>
  </div>
  <script>
    (async function () {
      const toc = document.getElementById('toc');
      try {
        const res = await fetch('/api/pages');
        if (!res.ok) throw new Error('list failed');
        const pages = await res.json();
        toc.textContent = '';
        if (!pages || pages.length === 0) {
          const li = document.createElement('li');
          li.className = 'empty';
          li.textContent = 'the notebook is empty. write the first page.';
          toc.appendChild(li);
          return;
        }
        for (const p of pages) {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = '/p/' + p.slug;
          a.textContent = p.title || 'untitled page';
          const dots = document.createElement('span');
          dots.className = 'dots';
          const date = document.createElement('span');
          date.className = 'date';
          date.textContent = formatDate(p.createdAt);
          li.appendChild(a);
          li.appendChild(dots);
          li.appendChild(date);
          toc.appendChild(li);
        }
      } catch (e) {
        toc.textContent = '';
        const li = document.createElement('li');
        li.className = 'empty';
        li.textContent = 'something spilled on the ink';
        toc.appendChild(li);
      }
    })();

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      const diff = (now - d) / 1000;
      if (diff < 60) return 'just now';
      if (diff < 3600) return Math.floor(diff / 60) + 'm';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h';
      if (diff < 604800) return Math.floor(diff / 86400) + 'd';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }
  </script>
</body>
</html>
